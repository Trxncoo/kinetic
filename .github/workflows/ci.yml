name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Cheapest, no-compile check first — fail fast before spending time
      # on vet/test. Shells out to the Makefile so this and local `make
      # fmt` can't drift apart.
      - name: Gofmt
        run: make fmt

      # Compiles and type-checks everything, so a separate `go build` step
      # would just redo this work.
      - name: Vet
        run: make vet

      # Not `make race`: that target skips -cover for faster local
      # iteration, but CI wants the coverage number, so this stays a
      # direct command instead of pretending the two are identical.
      - name: Test
        run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
